// =============================================
//           Raccoons autoexec.cfg
// =============================================

// ---------------------
// Mouse & Sensitivity
// ---------------------
unbindall

sensitivity 1

bind "mwheelup"   "+jump"
bind "mwheeldown" "+jump"
bind "mouse1"     "+attack"
bind "mouse2"     "+attack2"
bind "MOUSE_X"    "yaw"
bind "MOUSE_Y"    "pitch"
bind "X_AXIS"     "rightleft"
bind "Y_AXIS"     "!forwardback"

// ---------------------
// Movement
// ---------------------
bind "w"        "+forward"
bind "a"        "+left"
bind "s"        "+back"
bind "d"        "+right"
bind "f"        "switchhands"       // Left/right hand swap
bind "shift"    "+sprint"
bind "c"        "+duck"
bind "space"    "+jump"
bind "e"        "+use" 

// ---------------------
// Weapon & Item Binds
// ---------------------
bind "1"        "slot1"             // Primary weapon
bind "2"        "slot2"             // Secondary weapon
bind "3"        "slot3"             // Knife
bind "5"        "slot11"            // Zeus x27
bind "capslock" "drop"              // Drop weapon
bind "r"        "+reload"

// Inspect + wiggle (alias)
alias "+DoN"    "-lookatweapon; +reload"
alias "-DoN"    "-reload; +lookatweapon; -lookatweapon"
bind "n"        "+DoN"

bind "v"        "+lookatweapon"

// Grenades
bind "z"        "slot7"             // Flashbang
bind "x"        "slot10"            // Molotov / Incendiary
bind "alt"      "slot8"             // Smoke grenade
bind "q"        "slot6"             // HE grenade
bind "6"        "slot9"             // Decoy

// Quick bomb drop
alias "+dropbombbind" "slot3; slot5"
alias "-dropbombbind" "slot3; slot5; drop"
bind "g"        "+dropbombbind"

// ---------------------
// UI & Buy Menus
// ---------------------
bind "b"        "buymenu"
bind "f3"       "autobuy"
bind "f4"       "rebuy"

// ---------------------
// Communication
// ---------------------
bind "t"        "+voicerecord"      // Push-to-talk
bind "u"        "say_team"          // Team chat
bind "y"        "say"               // All chat
bind "["        "radio"             // Radio commands
bind "]"        "radio3"            // Radio commands
bind "4"        "player_ping"       // Ping
bind "0"        "voice_modenable_toggle"  // Mute/unmute voice

// ---------------------
// Audio Settings
// ---------------------
volume "0.85"
snd_mixahead "0.05"
snd_musicvolume "0"
snd_headphone_pan_exponent "2"
snd_headphone_pan_radial_weight "2"
voice_modenable "1"
snd_mute_losefocus "0"

// ---------------------
// Crosshair
// ---------------------
cl_crosshairstyle 4
cl_crosshairsize 1
cl_crosshairgap -4
cl_crosshairthickness 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshairalpha 255
cl_crosshairusealpha 1
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshair_drawoutline 0
cl_crosshair_outlinethickness 1
cl_crosshair_recoil 0
cl_crosshair_sniper_width 1
cl_crosshair_friendly_warning 0
cl_crosshairgap_useweaponvalue 0
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_splitdist 3

// ---------------------
// HUD & Radar
// ---------------------
+cl_show_team_equipment
cl_showloadout 1
cl_autohelp 0
cl_sanitize_player_names 0
hud_showtargetid 1
gameinstructor_enable 0
hud_scaling 0.95
cl_hud_color 4
cl_hud_radar_scale 0.91
cl_radar_scale 0.4
cl_radar_rotate 1
cl_radar_icon_scale_min 0.75
cl_radar_square_with_scoreboard 0

// Optional: Hold-to-enlarge radar (commented)
// alias +vrboost "cl_radar_scale 0.7"
// alias -vrboost "cl_radar_scale 0.35"
// bind n "+vrboost"

// ---------------------
// Performance & Video
// ---------------------
fps_max 300
r_fullscreen_gamma 2.5
engine_low_latency_sleep_after_client_tick 1
r_show_build_info 0
r_drawtracers_firstperson 0
cl_predict_body_shot_fx 0
cl_predict_head_shot_fx 0
cl_predict_kill_ragdolls 0
cl_predict_weapon_drop 0
cl_predict_bomb_defusal 0

// ---------------------
// Net & Info Binds
// ---------------------
alias "+netg" "cl_showfps 2; +showscores"
alias "-netg" "cl_showfps 0; -showscores"
bind "tab" "+netg"      // Show FPS + scoreboard

// ---------------------
// Utility & Cheats
// ---------------------
bind "j" "sv_cheats 1; noclip"
bind "=" "toggleconsole"

// ---------------------
// Quick Actions & Aliases
// ---------------------
bind "`"      "disconnect"
bind "pgup"   "exec execs\autoexec.cfg"

alias src   "exec execs\autoexec.cfg"
alias nade  "exec execs\nade.cfg"
alias surf  "exec execs\surf.cfg"
alias lj    "exec execs\lj.cfg"
alias jb    "exec execs\jb.cfg"
alias q     "quit"
alias dc    "disconnect"
alias sens  "sensitivity"
alias c     "clear"

// ---------------------
// Final message
// ---------------------
echo "Loaded autoexec.cfg - Larry The Peenar Snatcher Is Always Watching!"

