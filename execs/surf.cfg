sensitivity 1.5

// --------------------- //
// Surf Turn Binds       //
// --------------------- //
// bind "mouse5" "+turnleft"     // Mouse5 = Smooth left turn
// bind "mouse4" "+turnright"    // Mouse4 = Smooth right turn
bind "mouse5" +turn_left
bind "mouse4" +turn_right

// -------------------- //
// Aliases              //
// -------------------- //
alias +turn_right "turnright 0.60 1 1"
alias -turn_right "turnright -0.60 1 1"
alias +turn_left "turnleft 0.60 1 1"
alias -turn_left "turnleft -0.60 1 1"


