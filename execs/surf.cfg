sensitivity 1.35

// --------------------- //
// Surf Turn Binds       //
// --------------------- //
unbind "mouse4"
unbind "mouse5"

bind "mouse5" +turn_left
bind "mouse4" +turn_right

// -------------------- //
// Aliases              //
// -------------------- //
alias +turn_right "turnright 0.60 1 1"
alias -turn_right "turnright -0.60 1 1"
alias +turn_left "turnleft 0.60 1 1"
alias -turn_left "turnleft -0.60 1 1"


// --------------------- //
// Final message         //
// --------------------- //
log_flags Console +DoNotecho
log_flags General -DoNotecho
log_flags InputService +DoNotecho

