// =============================================
//           Raccoon's autoexec.cfg
// =============================================

// ---------------------
// Mouse & Movement
// ---------------------
sensitivity 1

bind mwheelup +jump
bind mwheeldown +jump
bind space +jump


// ---------------------
// Weapon & Item Binds
// ---------------------
bind mouse5 "slot7"          // usually P250/CZ
bind 4 "slot8"               // usually USP/Desert Eagle etc
bind g "slot6"               // HE grenade
bind mouse4 "slot10"         // usually knife or bomb?

alias "+dropbombbind" "slot3; slot5"
alias "-dropbombbind" "slot3; slot5; drop"
bind z "+dropbombbind"       // nice quick bomb drop bind


// ---------------------
// Utility & Cheats (practice / fun)
// ---------------------
bind j "sv_cheats 1; noclip"   // instant noclip when you need it

bind 0 "voice_modenable_toggle"   // quick voice chat mute/unmute


// ---------------------
// Crosshair
// ---------------------
cl_crosshairstyle 4
cl_crosshairsize 1
cl_crosshairgap -4
cl_crosshairthickness 1
cl_crosshairdot false
cl_crosshair_t false
cl_crosshairalpha 255
cl_crosshairusealpha true
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshair_drawoutline false
cl_crosshair_outlinethickness 1
cl_crosshair_recoil false
cl_crosshair_sniper_width 1
cl_crosshair_friendly_warning 1
cl_crosshairgap_useweaponvalue false

// Dynamic split stuff
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_splitdist 3


// ---------------------
// HUD & Radar
// ---------------------
+cl_show_team_equipment
cl_showloadout 1
cl_autohelp 0
cl_sanitize_player_names 0
hud_showtargetid 1
gameinstructor_enable 0

hud_scaling 0.95
cl_hud_color 4

cl_hud_radar_scale 0.91
cl_radar_scale 0.4
cl_radar_rotate 1
cl_radar_icon_scale_min 0.75
cl_radar_square_with_scoreboard 0

alias +vrboost "cl_radar_scale 0.7"
alias -vrboost "cl_radar_scale 0.35"
bind n +vrboost              // hold n for bigger radar (very useful)


// ---------------------
// Performance & Video
// ---------------------
fps_max 300
r_fullscreen_gamma 2.5
engine_low_latency_sleep_after_client_tick true
r_show_build_info false

// ---------------------
// Net & Info Binds
// ---------------------
alias +netg "cl_showfps 2; +showscores"
alias -netg "cl_showfps 0; -showscores"
bind tab "+netg"             // hold tab = fps + scoreboard


// ---------------------
// Misc & Quick Actions
// ---------------------
bind f "switchhands"         // left/right hand swap
bind ` "disconnect"          // quick leave server

alias q "quit"
alias ds "disconnect"
alias sens "sensitivity"


// ---------------------
// Final message
// ---------------------
echo "Loaded autoexec.cfg - Larry The Peenar Snatcher Is Always Watching!"




